name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Private repo: no brand assets or topics, and the hacsjson and
          # integration_manifest checks fetch files anonymously and always 404.
          # Drop the last two from this list if the repo becomes public.
          ignore: brands topics description hacsjson integration_manifest

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.14 && uv pip install -r requirements_test.txt
      - run: .venv/bin/pytest -q
